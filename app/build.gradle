apply from: 'download.gradle'

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "legado"
def version = "3." + releaseTime()
def gitCommits = 0
try {
    def gitCount = 'git rev-list HEAD --count'.execute().text.trim()
    if (gitCount.isInteger()) {
        gitCommits = gitCount as int
    }
} catch (Exception ignored) {
    // git not available during IDE sync, use default value 0
}

// 项目专用开发签名(keystore/legado-dev.jks)的密码解析:
// 必须通过用户级 gradle.properties 或环境变量提供,详见 keystore/README.md 与 gradle.properties.example。
// debug 构建缺失配置时直接报错,禁止回退到机器默认的 ~/.android/debug.keystore。
def devStorePassword = { ->
    def v = providers.gradleProperty("DEV_STORE_PASSWORD")
            .orElse(providers.environmentVariable("DEV_STORE_PASSWORD")).orNull
    if (v == null) {
        def requestedTasks = gradle.startParameter.taskNames.join(" ")
        if (requestedTasks =~ /(?i)debug/) {
            throw new GradleException(
                "缺少开发签名密码 DEV_STORE_PASSWORD(配置于用户级 ~/.gradle/gradle.properties 或同名环境变量)," +
                        "详见 keystore/README.md。本项目 debug 构建固定使用 keystore/legado-dev.jks," +
                        "禁止回退到机器默认 debug.keystore。"
            )
        }
        // 非 debug 构建(如 CI 的 assembleAppRelease)不会使用 devConfig,占位值仅为通过配置阶段
        v = "dev-signing-not-used"
    }
    v
}

android {
    compileSdk = compile_sdk_version
    buildToolsVersion = "36.1.0"
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
        // 项目专用开发签名:仅用于 debug 开发包,与 release 签名(GitHub Secrets)、
        // CI 测试签名(.github/workflows/legado.jks)完全分离,文件随仓库分发。
        devConfig {
            storeFile rootProject.file(
                    providers.gradleProperty("DEV_STORE_FILE").orElse("keystore/legado-dev.jks").get()
            )
            storePassword devStorePassword()
            keyAlias providers.gradleProperty("DEV_KEY_ALIAS").orElse("legado-dev").get()
            keyPassword storePassword
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    defaultConfig {
        applicationId "io.legado.app"
        minSdk 21
        targetSdk 36
        versionCode 10000 + gitCommits
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    testOptions {
        unitTests {
            //规则引擎在部分路径使用 android.text.TextUtils,
            //JVM 单元测试中返回默认值而非抛出 not-mocked 异常
            returnDefaultValues = true
        }
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            // 开发 APK 固定使用项目专用签名,禁止回退到机器默认 debug.keystore
            signingConfig signingConfigs.devConfig
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavor = variant.productFlavors[0].name
            outputFileName = "${name}_${flavor}_${defaultConfig.versionName}.apk"
        }
    }


    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
}

